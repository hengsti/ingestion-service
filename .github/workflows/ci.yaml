name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-ingestion-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  broker-integration:
    name: Isolated EMQX and InfluxDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INGEST_IT_PROJECT: ingest-it-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.1

      - name: Render isolated Compose stack
        run: docker compose -f ./tests/compose.integration.yaml -p "$INGEST_IT_PROJECT" config --quiet

      - name: Start isolated services
        run: docker compose -f ./tests/compose.integration.yaml -p "$INGEST_IT_PROJECT" up -d --wait --wait-timeout 180

      - name: Run real-container tests
        run: cargo test --all-features --locked --test broker_integration -- --ignored --test-threads=1

      - name: Collect bounded container logs
        if: failure()
        run: |
          mkdir -p target/broker-integration
          docker compose -f ./tests/compose.integration.yaml -p "$INGEST_IT_PROJECT" logs --no-color --tail 100 \
            | tail -c 65536 > target/broker-integration/compose.log

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/broker-integration/
          retention-days: 7

      - name: Remove successful test stack
        if: success()
        run: docker compose -f ./tests/compose.integration.yaml -p "$INGEST_IT_PROJECT" down -v --remove-orphans

      - name: Stop failed test stack without deleting its volumes
        if: failure()
        run: docker compose -f ./tests/compose.integration.yaml -p "$INGEST_IT_PROJECT" down --remove-orphans

  test:
    name: Test Rust project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

  compose:
    name: Validate compose.yaml
    runs-on: ubuntu-latest
    env:
      GHCR_OWNER: ci
      INGEST_TAG: ci
      RUST_LOG: info
      MQTT_HOST: ci
      MQTT_PORT: "1883"
      MQTT_TOPIC_DLQ: smarthome/_dlq/ci
      INGEST_ROUTES_FILE: /app/config/routes.json
      INFLUX_URL: http://ci:8086
      INFLUX_ORG: ci
      INFLUX_BUCKET: ci
      INFLUX_TOKEN: ci
      WAL_MAX_BYTES: "268435456"
      QUARANTINE_MAX_BYTES: "268435456"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Check env contract against src/config.rs
        shell: bash
        run: |
          compose_keys=$(docker compose -f compose.yaml config --format json \
            | jq -r '.services.ingest.environment | keys[]' | sort -u)
          code_keys=$(grep -oE 'env_var\("[A-Z_]+"\)' src/config.rs \
            | sed -E 's/env_var\("([A-Z_]+)"\)/\1/' | sort -u)
          # RUST_LOG is read by tracing, not Config::from_env.
          unread=$(comm -23 <(echo "$compose_keys") <(echo "$code_keys") \
            | grep -vx 'RUST_LOG' || true)
          # Optional variables with code defaults may be omitted.
          missing=$(comm -13 <(echo "$compose_keys") <(echo "$code_keys") \
            | grep -vxE 'RUST_LOG|WAL_SEGMENT_BYTES|WAL_QUEUE_CAPACITY|INPUT_QUEUE_CAPACITY|MQTT_CLEAN_SESSION' || true)
          if [[ -n "$unread$missing" ]]; then
            echo "::error file=compose.yaml::env drift. Unread by src/config.rs: [${unread//$'\n'/ }]. Missing from compose.yaml: [${missing//$'\n'/ }]"
            exit 1
          fi
