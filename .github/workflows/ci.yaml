name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-ingestion-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test Rust project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

  compose:
    name: Validate compose.yaml
    runs-on: ubuntu-latest
    env:
      GHCR_OWNER: ci
      INGEST_TAG: ci
      RUST_LOG: info
      MQTT_HOST: ci
      MQTT_PORT: "1883"
      INFLUX_URL: http://ci:8086
      INFLUX_ORG: ci
      INFLUX_BUCKET: ci
      INFLUX_TOKEN: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Check env contract against src/config.rs
        shell: bash
        run: |
          compose_keys=$(docker compose -f compose.yaml config --format json \
            | jq -r '.services.ingest.environment | keys[]' | sort -u)
          code_keys=$(grep -oE 'env_var\("[A-Z_]+"\)' src/config.rs \
            | sed -E 's/env_var\("([A-Z_]+)"\)/\1/' | sort -u)
          # RUST_LOG is read by tracing, MQTT_TOPIC_* by prefix scan.
          unread=$(comm -23 <(echo "$compose_keys") <(echo "$code_keys") \
            | grep -vE '^(RUST_LOG|MQTT_TOPIC_[A-Z_]+)$' || true)
          # Optional variables with code defaults may be omitted.
          missing=$(comm -13 <(echo "$compose_keys") <(echo "$code_keys") \
            | grep -vxE 'WAL_SEGMENT_BYTES|WAL_QUEUE_CAPACITY' || true)
          if [[ -n "$unread$missing" ]]; then
            echo "::error file=compose.yaml::env drift. Unread by src/config.rs: [${unread//$'\n'/ }]. Missing from compose.yaml: [${missing//$'\n'/ }]"
            exit 1
          fi

