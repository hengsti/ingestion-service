# Env contract: docs/configuration.md (checked against src/config.rs in CI).
# All ${VAR} values must be set in the project root .env (never committed).
services:
  ingest:
    image: ${INGEST_IMAGE:?set INGEST_IMAGE (immutable image reference)}
    container_name: ingest
    restart: unless-stopped
    expose:
      - "8085"
    volumes:
      - wal:/data/wal # must match WAL_DIR
      - quarantine:/data/quarantine # must match QUARANTINE_DIR
      - type: bind
        source: ${INGEST_CONFIG_DIR:-./config}
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
    environment:
      RUST_LOG: ${RUST_LOG:?set RUST_LOG (e.g. info)}

      # Input: MQTT
      INPUT_SOURCE: mqtt
      MQTT_HOST: ${MQTT_HOST:?set MQTT_HOST (broker hostname)}
      MQTT_PORT: ${MQTT_PORT:?set MQTT_PORT (broker port)}
      MQTT_CLIENT_ID: smarthome-ingest
      # Broker keeps QoS 1 messages while ingest is down; requires a unique MQTT_CLIENT_ID.
      MQTT_CLEAN_SESSION: "false"
      # Optional; passed through from the host environment only when set.
      MQTT_USERNAME:
      MQTT_PASSWORD:
      MQTT_TOPIC_DLQ: smarthome/_dlq/ingest
      INGEST_ROUTES_FILE: /app/config/routes.json
      INPUT_QUEUE_CAPACITY: "1000000"

      # Output: InfluxDB
      OUTPUT_SINK: influx
      INFLUX_URL: ${INFLUX_URL:?set INFLUX_URL (http:// or https://)}
      INFLUX_ORG: ${INFLUX_ORG:?set INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET:?set INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN (InfluxDB write token)}
      BATCH_SIZE: "500"
      FLUSH_INTERVAL_MS: "10000"

      # Write-ahead log
      WAL_DIR: /data/wal
      WAL_MAX_BYTES: ${WAL_MAX_BYTES:?set WAL_MAX_BYTES}
      QUARANTINE_DIR: /data/quarantine
      QUARANTINE_MAX_BYTES: ${QUARANTINE_MAX_BYTES:?set QUARANTINE_MAX_BYTES}

      # HTTP: cache API (/healthz, /readyz) and Prometheus metrics
      CACHE_BIND: 0.0.0.0:8085
      CACHE_TTL_MS: "30000"
      CACHE_BUFFER: "10"
      METRICS_BIND: 0.0.0.0:9090

volumes:
  wal:
  quarantine:
